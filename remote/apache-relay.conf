# Public Render HTTPS/WSS terminates at Render's ingress. The Node listener is
# loopback-only; Apache forwards WebSocket upgrades without invoking PHP routing.
ProxyRequests Off
ProxyWebsocketFallbackToProxyHttp Off
ProxyPass "/public/remote-support/relay/health" "http://127.0.0.1:8081/health"
ProxyPass "/remote-support/relay/health" "http://127.0.0.1:8081/health"
ProxyPass "/public/remote-support/relay/" "ws://127.0.0.1:8081/"
ProxyPass "/public/remote-support/relay" "ws://127.0.0.1:8081/"
ProxyPass "/remote-support/relay/" "ws://127.0.0.1:8081/"
ProxyPass "/remote-support/relay" "ws://127.0.0.1:8081/"
